# Flatpak-manifest för Signalspanaren.
#
# Bygg (kräver flatpak-builder och GNOME 51-körtiden):
#   flatpak install flathub org.flatpak.Builder org.gnome.Platform//51 org.gnome.Sdk//51
#   flatpak run org.flatpak.Builder --user --install --force-clean build-dir \
#       flatpak/se.eh.Signalspanaren.yaml
#   flatpak run se.eh.Signalspanaren
#
# Appen får rå USB-åtkomst (--device=all) för RTL-SDR och ljud via PulseAudio/PipeWire.
app-id: se.eh.Signalspanaren
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: signalspanaren

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network          # OSM-kartrutor, rtl_tcp, KiwiSDR och webbgränssnittet
  - --device=all             # rå USB-åtkomst till RTL-SDR-dongeln
  - --filesystem=xdg-music:create   # inspelningar hamnar i ~/Musik/Signalspanaren
  - --env=PYTHONPATH=/app/lib/python3.14/site-packages

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/gtk-doc
  - '*.a'
  - '*.la'

modules:
  # ── libusb (utvecklingsfiler saknas i SDK:n) ──
  - name: libusb
    buildsystem: autotools
    config-opts:
      - --disable-udev
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2
        sha256: ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575

  # ── RTL-SDR-biblioteket (librtlsdr.so) ──
  - name: librtlsdr
    buildsystem: cmake-ninja
    config-opts:
      - -DDETACH_KERNEL_DRIVER=ON
      - -DINSTALL_UDEV_RULES=OFF
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/osmocom/rtl-sdr/archive/refs/tags/v2.0.2.tar.gz
        sha256: d69943eb32df742bc38a00ce6615e41250fd57851174e5ff916ec31e9e9e68e9

  # ── Kartbiblioteket (bara rasterkartor, ingen vektormotor → inga extra beroenden) ──
  - name: libshumate
    buildsystem: meson
    config-opts:
      - -Dvector_renderer=false
      - -Dgtk_doc=false
      - -Dvapi=false
      - -Dgir=true
      - -Ddemos=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libshumate/1.5/libshumate-1.5.5.tar.xz
        sha256: ce27d88537a37cd5c45959c3bb7cc18c1c18b3d2e663d02bcf46fc66f7414a92

  # ── numpy och scipy (färdiga hjul, ingen kompilering) ──
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST}
        numpy-2.5.4-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        scipy-1.18.1-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/16/d5/928078d2b28f26829b138b4a6c3980045022fb409f570657a224ae60ef4e/numpy-2.5.4-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: d549420b8858885cea8838a727842249218b9c1da24dd517e25c9c7a948310a3
      - type: file
        url: https://files.pythonhosted.org/packages/6b/89/2a844506d49651e9aa1af6ef95b6bd8031cb1d5a4375edec6155037e04cf/scipy-1.18.1-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: ac0333bdf38309aa3dcbe7e3fa7ea29e7a2c37c6ea306a757b700ded8e4596ad

  # ── Själva Signalspanaren ──
  - name: signalspanaren
    buildsystem: simple
    build-commands:
      - install -d /app/share/signalspanaren
      - install -m644 signalspanaren.py avkodare.py adsb.py adsb_karta.py kartvy.py aktivitet.py
        analys.py analysavkodare.py iqfil.py kiwisdr.py dspfilter.py webbmottagare.py signaldb.py frontpanel.py skarm.py MANUAL.txt /app/share/signalspanaren/
      - |
        cat > /app/bin/signalspanaren <<'EOF'
        #!/bin/sh
        exec python3 /app/share/signalspanaren/signalspanaren.py "$@"
        EOF
        chmod 755 /app/bin/signalspanaren
      - |
        cat > /app/bin/flygradar <<'EOF'
        #!/bin/sh
        exec python3 /app/share/signalspanaren/adsb_karta.py "$@"
        EOF
        chmod 755 /app/bin/flygradar
      - install -Dm644 se.eh.Signalspanaren.svg
        /app/share/icons/hicolor/scalable/apps/se.eh.Signalspanaren.svg
      - install -Dm644 flatpak/se.eh.Signalspanaren.desktop
        /app/share/applications/se.eh.Signalspanaren.desktop
      - install -Dm644 flatpak/se.eh.Signalspanaren.metainfo.xml
        /app/share/metainfo/se.eh.Signalspanaren.metainfo.xml
    sources:
      - type: dir
        path: ..
